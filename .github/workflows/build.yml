name: Build YouMusic APK

on:
  push:
  workflow_dispatch:

# Needed so the workflow can create releases and upload the APK to them.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # so we can see what the latest commit changed

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YouMusic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YouMusic-apk
          path: YouMusic.apk

      # A push to main that changes the app itself becomes a release, with the APK
      # attached. Pushes that only touch docs still build, but don't make a release.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --name-only HEAD~1 HEAD | grep -q '^app/'; then
            echo "No app changes in this commit, skipping release."
            exit 0
          fi
          VERSION=$(grep -oP "def baseVersion = '\K[^']+" app/build.gradle)
          TAG="v${VERSION}.${{ github.run_number }}"
          # Release notes = the newest section of CHANGELOG.md (without its heading).
          awk '/^## /{n++; next} n==1' CHANGELOG.md > notes.md
          printf '\n---\n**Install:** download **YouMusic.apk** below on your Android phone and open it.\n' >> notes.md
          gh release create "$TAG" YouMusic.apk --title "YouMusic ${VERSION}" --latest --notes-file notes.md
